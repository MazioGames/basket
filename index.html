<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Basket Mobile - Canestro & Difesa IA - Phaser 3</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

<script>
class BasketballMobileGame extends Phaser.Scene {
  constructor() {
    super('BasketballMobileGame');
  }

  preload() {
    this.createGraphicAssets();
  }

  createGraphicAssets() {
    let g = this.add.graphics();

    // Giocatore Attaccante (Azzurro)
    g.fillStyle(0x3498db, 1);
    g.fillRect(0, 0, 32, 64);
    g.generateTexture('player', 32, 64);
    g.clear();

    // Difensore IA (Rosso)
    g.fillStyle(0xe74c3c, 1);
    g.fillRect(0, 0, 32, 64);
    g.generateTexture('defender', 32, 64);
    g.clear();

    // Pallone (Arancione)
    g.fillStyle(0xe67e22, 1);
    g.fillCircle(12, 12, 12);
    g.generateTexture('ball', 24, 24);
    g.clear();

    // Struttura Canestro Visibile (Tabellone + Anello + Retina)
    g.fillStyle(0xffffff, 0.9);
    g.fillRect(25, 0, 8, 90); // Tabellone bianco
    g.fillStyle(0xe67e22, 1);
    g.fillRect(0, 45, 25, 6);  // Anello arancione
    g.fillStyle(0xffffff, 0.5);
    g.beginPath();
    g.moveTo(2, 51);
    g.lineTo(7, 75);
    g.lineTo(18, 75);
    g.lineTo(23, 51);
    g.closePath();
    g.fillPath(); // Retina trasparente
    g.generateTexture('hoop_structure', 35, 90);
    g.clear();

    // Controlli Touch
    g.fillStyle(0xffffff, 0.3);
    g.fillCircle(30, 30, 30);
    g.generateTexture('btn_arrow', 60, 60);
    g.clear();

    g.fillStyle(0x2ecc71, 0.7);
    g.fillCircle(40, 40, 40);
    g.generateTexture('btn_shoot', 80, 80);
    g.clear();

    g.fillStyle(0xf1c40f, 0.7);
    g.fillCircle(25, 25, 25);
    g.generateTexture('btn_reset', 50, 50);
    g.destroy();
  }

  create() {
    this.input.addPointer(2);

    // Mondo e Fisica
    this.physics.world.setBounds(0, 0, 800, 450);
    this.physics.world.gravity.y = 800;

    // Campo da gioco (Pavimento)
    this.ground = this.add.rectangle(400, 440, 800, 20, 0x7f8c8d);
    this.physics.add.existing(this.ground, true);

    // Struttura Asta Canestro
    const pole = this.add.rectangle(725, 300, 10, 260, 0x333333);

    // Canestro Visibile (Spostato a X: 690 per massima visibilità)
    this.hoop = this.physics.add.staticImage(690, 220, 'hoop_structure');
    
    // Zona di rilevamento canestro (posizionata esattamente sotto l'anello)
    this.scoreZone = this.add.zone(678, 268, 20, 5);
    this.physics.add.existing(this.scoreZone, true);

    // Giocatore Attaccante
    this.player = this.physics.add.sprite(150, 350, 'player');
    this.player.setCollideWorldBounds(true);
    this.physics.add.collider(this.player, this.ground);

    // Difensore IA
    this.defender = this.physics.add.sprite(500, 350, 'defender');
    this.defender.setCollideWorldBounds(true);
    this.physics.add.collider(this.defender, this.ground);

    // Pallone
    this.ball = this.physics.add.sprite(150, 330, 'ball');
    this.ball.setBounce(0.6);
    this.ball.setFriction(0.1);
    this.ball.setCollideWorldBounds(true);
    this.physics.add.collider(this.ball, this.ground);
    this.physics.add.collider(this.ball, this.hoop);

    // Collisione Pallone - Difensore (Possibilità di Stoppata)
    this.physics.add.collider(this.ball, this.defender, this.onBallBlocked, null, this);

    // Stato Tiro e Gioco
    this.isHoldingBall = true;
    this.isCharging = false;
    this.chargePower = 0;
    this.maxPower = 720;
    this.minPower = 220;
    this.canScore = true;

    // Grafica Traiettoria
    this.trajectoryGraphics = this.add.graphics();

    // Interfaccia Utente (UI)
    this.score = 0;
    this.scoreText = this.add.text(20, 15, 'Punti: 0', { fontSize: '22px', fill: '#fff', fontStyle: 'bold' });
    this.feedbackText = this.add.text(400, 180, '', { fontSize: '32px', fill: '#f1c40f', fontStyle: 'bold' }).setOrigin(0.5);

    // Overlap per Canestro
    this.physics.add.overlap(this.ball, this.scoreZone, this.onScore, null, this);

    // Controlli Touch
    this.moveLeft = false;
    this.moveRight = false;
    this.createTouchControls();
  }

  createTouchControls() {
    // Tasto Sinistra
    const btnLeft = this.add.image(60, 390, 'btn_arrow').setInteractive();
    this.add.text(52, 380, '◄', { fontSize: '22px', fill: '#fff' });

    btnLeft.on('pointerdown', () => { this.moveLeft = true; });
    btnLeft.on('pointerup', () => { this.moveLeft = false; });
    btnLeft.on('pointerout', () => { this.moveLeft = false; });

    // Tasto Destra
    const btnRight = this.add.image(140, 390, 'btn_arrow').setInteractive();
    this.add.text(132, 380, '►', { fontSize: '22px', fill: '#fff' });

    btnRight.on('pointerdown', () => { this.moveRight = true; });
    btnRight.on('pointerup', () => { this.moveRight = false; });
    btnRight.on('pointerout', () => { this.moveRight = false; });

    // Tasto TIRO
    const btnShoot = this.add.image(710, 380, 'btn_shoot').setInteractive();
    this.add.text(685, 372, 'TIRO', { fontSize: '18px', fill: '#fff', fontStyle: 'bold' });

    btnShoot.on('pointerdown', () => {
      if (this.isHoldingBall) {
        this.isCharging = true;
        this.chargePower = this.minPower;

        // Salto del giocatore durante la rincorsa/caricamento
        if (this.player.body.touching.down) {
          this.player.setVelocityY(-250);
        }
      }
    });

    btnShoot.on('pointerup', () => {
      if (this.isHoldingBall && this.isCharging) {
        this.shootBall();
      }
    });

    // Tasto Reset Palla
    const btnReset = this.add.image(750, 40, 'btn_reset').setInteractive();
    this.add.text(738, 30, '↺', { fontSize: '24px', fill: '#fff', fontStyle: 'bold' });

    btnReset.on('pointerdown', () => {
      this.resetBall();
    });
  }

  update() {
    // Movimento Giocatore
    if (!this.isCharging) {
      if (this.moveLeft) {
        this.player.setVelocityX(-160);
      } else if (this.moveRight) {
        this.player.setVelocityX(160);
      } else {
        this.player.setVelocityX(0);
      }
    } else {
      this.player.setVelocityX(0);
    }

    // --- LOGICA DIFENSORE IA ---
    this.updateDefenderAI();

    // Palla in mano al giocatore
    if (this.isHoldingBall) {
      this.ball.setPosition(this.player.x + 15, this.player.y - 10);
      this.ball.body.setVelocity(0, 0);
      this.ball.body.setAllowGravity(false);

      if (this.isCharging) {
        this.chargePower = Math.min(this.chargePower + 8, this.maxPower);
        this.drawTrajectory();
      }
    }
  }

  updateDefenderAI() {
    // Mantiene una posizione difensiva tra l'attaccante e il canestro
    const targetX = Phaser.Math.Clamp(this.player.x + 120, 350, 630);
    const distanceToTarget = targetX - this.defender.x;

    if (Math.abs(distanceToTarget) > 10) {
      this.defender.setVelocityX(distanceToTarget * 2);
    } else {
      this.defender.setVelocityX(0);
    }

    // Salto di stoppata dell'IA se l'attaccante sta caricando il tiro vicino
    const distanceToPlayer = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.defender.x, this.defender.y);
    if (this.isCharging && distanceToPlayer < 180 && this.defender.body.touching.down) {
      this.defender.setVelocityY(-350); // Salto di contestazione del tiro
    }
  }

  drawTrajectory() {
    this.trajectoryGraphics.clear();
    this.trajectoryGraphics.lineStyle(2, 0x00ff00, 0.8);

    const startX = this.ball.x;
    const startY = this.ball.y;
    const vx = this.chargePower * 0.72;
    const vy = -this.chargePower * 0.95;
    const gravity = this.physics.world.gravity.y;

    let prevX = startX;
    let prevY = startY;

    for (let t = 0.05; t < 1.1; t += 0.05) {
      const x = startX + vx * t;
      const y = startY + vy * t + 0.5 * gravity * t * t;
      this.trajectoryGraphics.lineBetween(prevX, prevY, x, y);
      prevX = x;
      prevY = y;
    }
  }

  shootBall() {
    this.isHoldingBall = false;
    this.isCharging = false;
    this.canScore = true;
    this.trajectoryGraphics.clear();

    this.ball.body.setAllowGravity(true);
    const vx = this.chargePower * 0.72;
    const vy = -this.chargePower * 0.95;

    this.ball.setVelocity(vx, vy);
    this.ball.setAngularVelocity(300);
  }

  resetBall() {
    this.isHoldingBall = true;
    this.isCharging = false;
    this.canScore = true;
    this.trajectoryGraphics.clear();
    this.ball.setAngularVelocity(0);
  }

  onBallBlocked() {
    if (!this.isHoldingBall && this.canScore) {
      this.canScore = false;
      this.showFeedback('STOPPATA!', '#e74c3c');
    }
  }

  onScore(ball, zone) {
    if (!this.isHoldingBall && this.canScore && ball.body.velocity.y > 0) {
      this.score += 2;
      this.canScore = false;
      this.scoreText.setText('Punti: ' + this.score);
      this.showFeedback('CANESTRO! +2', '#f1c40f');
    }
  }

  showFeedback(text, color) {
    this.feedbackText.setText(text);
    this.feedbackText.setStyle({ fill: color });
    this.feedbackText.setScale(1);
    this.feedbackText.setAlpha(1);

    this.tweens.add({
      targets: this.feedbackText,
      y: 140,
      alpha: 0,
      duration: 1200,
      ease: 'Power2',
      onComplete: () => {
        this.feedbackText.setPosition(400, 180);
      }
    });
  }
}

const config = {
  type: Phaser.AUTO,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: 800,
    height: 450
  },
  physics: {
    default: 'arcade',
    arcade: {
      gravity: { y: 800 },
      debug: false
    }
  },
  scene: BasketballMobileGame
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
