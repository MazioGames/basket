<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Basket Top-Down 3P & Dunk</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

<script>
class BasketballTopDown extends Phaser.Scene {
  constructor() {
    super('BasketballTopDown');
  }

  preload() {
    this.createGraphicAssets();
  }

  createGraphicAssets() {
    let g = this.add.graphics();

    // Attaccante (Azzurro)
    g.fillStyle(0x3498db, 1);
    g.fillCircle(16, 16, 16);
    g.fillStyle(0xffffff, 1);
    g.fillCircle(16, 10, 6); // Testa/spalle
    g.generateTexture('player', 32, 32);
    g.clear();

    // Difensore IA (Rosso)
    g.fillStyle(0xe74c3c, 1);
    g.fillCircle(16, 16, 16);
    g.fillStyle(0xffffff, 1);
    g.fillCircle(16, 10, 6);
    g.generateTexture('defender', 32, 32);
    g.clear();

    // Pallone (Arancione)
    g.fillStyle(0xe67e22, 1);
    g.fillCircle(10, 10, 10);
    g.generateTexture('ball', 20, 20);
    g.clear();

    // D-Pad / Tasti Movimento
    g.fillStyle(0xffffff, 0.25);
    g.fillRoundedRect(0, 0, 50, 50, 10);
    g.generateTexture('btn_dir', 50, 50);
    g.clear();

    // Tasto Tiro
    g.fillStyle(0x2ecc71, 0.8);
    g.fillCircle(35, 35, 35);
    g.generateTexture('btn_shoot', 70, 70);
    g.clear();

    // Tasto Reset
    g.fillStyle(0xf1c40f, 0.8);
    g.fillCircle(20, 20, 20);
    g.generateTexture('btn_reset', 40, 40);
    g.destroy();
  }

  create() {
    this.input.addPointer(2);
    this.physics.world.setBounds(0, 0, 450, 800);

    // --- DISEGNO DEL CAMPO ---
    this.drawCourt();

    // Canestro (Bersaglio)
    this.hoopX = 225;
    this.hoopY = 95;
    this.scoreZone = this.add.zone(this.hoopX, this.hoopY, 24, 24);
    this.physics.add.existing(this.scoreZone, true);

    // Giocatore Attaccante
    this.player = this.physics.add.sprite(225, 600, 'player');
    this.player.setCollideWorldBounds(true);

    // Difensore IA
    this.defender = this.physics.add.sprite(225, 300, 'defender');
    this.defender.setCollideWorldBounds(true);

    // Pallone
    this.ball = this.physics.add.sprite(225, 620, 'ball');
    this.ball.setCollideWorldBounds(true);

    // Stato Gioco
    this.isHoldingBall = true;
    this.isShooting = false;
    this.isDunking = false;
    this.canScore = true;
    this.chargePower = 0;
    this.chargingUp = true;
    this.isCharging = false;

    // UI & Timer
    this.score = 0;
    this.shotClockTime = 24;
    this.scoreText = this.add.text(15, 15, 'Punti: 0', { fontSize: '18px', fill: '#fff', fontStyle: 'bold' });
    this.shotClockText = this.add.text(350, 15, '24s: 24', { fontSize: '18px', fill: '#f1c40f', fontStyle: 'bold' });
    this.feedbackText = this.add.text(225, 380, '', { fontSize: '28px', fill: '#f1c40f', fontStyle: 'bold' }).setOrigin(0.5);

    // Barra Potenza Tiro
    this.powerBarBg = this.add.rectangle(225, 710, 200, 12, 0x333333).setVisible(false);
    this.powerBarFill = this.add.rectangle(125, 710, 0, 12, 0x2ecc71).setVisible(false);
    this.powerTarget = this.add.rectangle(225, 710, 20, 16, 0xffffff, 0.6).setVisible(false);

    // Timer 24s
    this.shotClockEvent = this.time.addEvent({
      delay: 1000,
      callback: this.updateShotClock,
      callbackScope: this,
      loop: true
    });

    // Overlap Canestro e Collisione Difensore
    this.physics.add.overlap(this.ball, this.scoreZone, this.onScore, null, this);
    this.physics.add.overlap(this.ball, this.defender, this.onBallBlocked, null, this);

    // Controlli Direzionali
    this.moveUp = false;
    this.moveDown = false;
    this.moveLeft = false;
    this.moveRight = false;
    this.createTouchControls();
  }

  drawCourt() {
    let g = this.add.graphics();

    // Parquet del campo
    g.fillStyle(0xd35400, 1);
    g.fillRect(10, 50, 430, 740);

    // Linee bianche del campo
    g.lineStyle(3, 0xffffff, 0.9);
    g.strokeRect(10, 50, 430, 740);

    // Area dei 3 Punti (Arco)
    g.beginPath();
    g.arc(225, 90, 220, 0.15 * Math.PI, 0.85 * Math.PI, false);
    g.strokePath();

    // Area Pitturato / Chiave (Rettangolo)
    g.fillStyle(0xc0392b, 0.8);
    g.fillRect(155, 50, 140, 190);
    g.strokeRect(155, 50, 140, 190);

    // Lunetta / Campana del Tiro Libero (Cerchio in cima all'area)
    g.beginPath();
    g.arc(225, 240, 70, 0, Math.PI, false); // Semicerchio pieno
    g.strokePath();

    g.lineStyle(2, 0xffffff, 0.5);
    g.beginPath();
    g.arc(225, 240, 70, Math.PI, 2 * Math.PI, false); // Semicerchio tratteggiato
    g.strokePath();

    // Tabellone e Anello Canestro
    g.lineStyle(4, 0xffffff, 1);
    g.lineBetween(185, 65, 265, 65); // Tabellone

    g.lineStyle(3, 0xe67e22, 1);
    g.strokeCircle(225, 80, 15); // Anello canestro
  }

  createTouchControls() {
    // D-PAD per scorrere in tutte le 4 direzioni
    const bx = 80, by = 680, step = 48;

    // Su
    const btnUp = this.add.image(bx, by - step, 'btn_dir').setInteractive();
    this.add.text(bx - 6, by - step - 12, '▲', { fontSize: '20px', fill: '#fff' });
    btnUp.on('pointerdown', () => { this.moveUp = true; });
    btnUp.on('pointerup', () => { this.moveUp = false; });
    btnUp.on('pointerout', () => { this.moveUp = false; });

    // Giù
    const btnDown = this.add.image(bx, by + step, 'btn_dir').setInteractive();
    this.add.text(bx - 6, by + step - 12, '▼', { fontSize: '20px', fill: '#fff' });
    btnDown.on('pointerdown', () => { this.moveDown = true; });
    btnDown.on('pointerup', () => { this.moveDown = false; });
    btnDown.on('pointerout', () => { this.moveDown = false; });

    // Sinistra
    const btnLeft = this.add.image(bx - step, by, 'btn_dir').setInteractive();
    this.add.text(bx - step - 8, by - 12, '◄', { fontSize: '20px', fill: '#fff' });
    btnLeft.on('pointerdown', () => { this.moveLeft = true; });
    btnLeft.on('pointerup', () => { this.moveLeft = false; });
    btnLeft.on('pointerout', () => { this.moveLeft = false; });

    // Destra
    const btnRight = this.add.image(bx + step, by, 'btn_dir').setInteractive();
    this.add.text(bx + step - 6, by - 12, '►', { fontSize: '20px', fill: '#fff' });
    btnRight.on('pointerdown', () => { this.moveRight = true; });
    btnRight.on('pointerup', () => { this.moveRight = false; });
    btnRight.on('pointerout', () => { this.moveRight = false; });

    // Tasto TIRO / SCHIACCIATA
    const btnShoot = this.add.image(360, 680, 'btn_shoot').setInteractive();
    this.add.text(338, 672, 'TIRO', { fontSize: '16px', fill: '#fff', fontStyle: 'bold' });

    btnShoot.on('pointerdown', () => {
      if (this.isHoldingBall && !this.isShooting && !this.isDunking) {
        const distToHoop = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.hoopX, this.hoopY);

        // Se dentro l'area dei 3P o vicino alla lunetta -> Schiacciata
        if (distToHoop < 200) {
          this.executeDunk();
        } else {
          // Altrimenti carica la barra di tiro da fuori
          this.isCharging = true;
          this.chargePower = 0;
          this.powerBarBg.setVisible(true);
          this.powerBarFill.setVisible(true);
          this.powerTarget.setVisible(true);
        }
      }
    });

    btnShoot.on('pointerup', () => {
      if (this.isHoldingBall && this.isCharging && !this.isDunking) {
        this.shootBall();
      }
    });

    // Tasto Reset
    const btnReset = this.add.image(400, 30, 'btn_reset').setInteractive();
    this.add.text(393, 20, '↺', { fontSize: '20px', fill: '#fff', fontStyle: 'bold' });
    btnReset.on('pointerdown', () => { this.resetBall(); });
  }

  updateShotClock() {
    if (this.shotClockTime > 0) {
      this.shotClockTime--;
      this.shotClockText.setText('24s: ' + this.shotClockTime);
      if (this.shotClockTime <= 5) this.shotClockText.setFill('#e74c3c');
      else this.shotClockText.setFill('#f1c40f');
    } else {
      this.showFeedback('INFRAZIONE 24 SECONDI!', '#e74c3c');
      this.resetBall();
    }
  }

  resetShotClock() {
    this.shotClockTime = 24;
    this.shotClockText.setText('24s: 24');
    this.shotClockText.setFill('#f1c40f');
  }

  update() {
    // Movimento 360° Giocatore
    let vx = 0, vy = 0;
    const speed = 170;

    if (!this.isCharging && !this.isDunking && !this.isShooting) {
      if (this.moveLeft) vx = -speed;
      if (this.moveRight) vx = speed;
      if (this.moveUp) vy = -speed;
      if (this.moveDown) vy = speed;
    }

    this.player.setVelocity(vx, vy);

    // Caricamento Potenza Tiro
    if (this.isCharging) {
      if (this.chargingUp) {
        this.chargePower += 4;
        if (this.chargePower >= 200) this.chargingUp = false;
      } else {
        this.chargePower -= 4;
        if (this.chargePower <= 0) this.chargingUp = true;
      }
      this.powerBarFill.setSize(this.chargePower, 12);
    }

    // Pallone segue il giocatore
    if (this.isHoldingBall && !this.isDunking) {
      this.ball.setPosition(this.player.x, this.player.y - 12);
    }

    // Difensore IA
    this.updateDefenderAI();
  }

  updateDefenderAI() {
    if (this.isDunking) return;

    // Il difensore si posiziona tra il giocatore e il canestro
    const targetX = Phaser.Math.Linear(this.player.x, this.hoopX, 0.4);
    const targetY = Phaser.Math.Linear(this.player.y, this.hoopY, 0.4);

    const dist = Phaser.Math.Distance.Between(this.defender.x, this.defender.y, targetX, targetY);
    if (dist > 10) {
      this.physics.moveTo(this.defender, targetX, targetY, 130);
    } else {
      this.defender.setVelocity(0, 0);
    }
  }

  executeDunk() {
    this.isDunking = true;
    this.isHoldingBall = false;

    // Animazione di volo e schiacciata in 3D (effetto scala)
    this.tweens.add({
      targets: [this.player, this.ball],
      scaleX: 1.5,
      scaleY: 1.5,
      duration: 350,
      yoyo: true,
      ease: 'Quad.easeOut'
    });

    this.tweens.add({
      targets: this.player,
      x: this.hoopX,
      y: this.hoopY + 30,
      duration: 500,
      ease: 'Power2.easeOut',
      onUpdate: () => {
        this.ball.setPosition(this.player.x, this.player.y - 10);
      },
      onComplete: () => {
        this.isDunking = false;
        this.ball.setPosition(this.hoopX, this.hoopY);
        this.score += 2;
        this.scoreText.setText('Punti: ' + this.score);
        this.showFeedback('SCHIACCIATA SPETTACOLARE! +2', '#2ecc71');
        this.resetShotClock();

        this.time.delayedCall(800, () => { this.resetBall(); });
      }
    });
  }

  shootBall() {
    this.isHoldingBall = false;
    this.isCharging = false;
    this.isShooting = true;
    this.canScore = true;

    this.powerBarBg.setVisible(false);
    this.powerBarFill.setVisible(false);
    this.powerTarget.setVisible(false);

    // Valutazione precisione tiro da fuori (distanza dal centro della barra)
    const accuracy = Math.abs(100 - this.chargePower); // 0 è il tiro perfetto
    const distToHoop = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.hoopX, this.hoopY);
    const is3Pointer = distToHoop > 220;

    // Parabola di tiro top-down
    const duration = 900;
    const targetX = accuracy < 25 ? this.hoopX : this.hoopX + Phaser.Math.Between(-50, 50);
    const targetY = accuracy < 25 ? this.hoopY : this.hoopY + Phaser.Math.Between(-50, 50);

    // Effetto parabola (salita e discesa)
    this.tweens.add({
      targets: this.ball,
      scaleX: 1.8,
      scaleY: 1.8,
      duration: duration / 2,
      yoyo: true,
      ease: 'Sine.easeOut'
    });

    this.tweens.add({
      targets: this.ball,
      x: targetX,
      y: targetY,
      duration: duration,
      ease: 'Cubic.easeOut',
      onComplete: () => {
        this.isShooting = false;
        if (accuracy < 25) {
          const pts = is3Pointer ? 3 : 2;
          this.score += pts;
          this.scoreText.setText('Punti: ' + this.score);
          this.showFeedback(is3Pointer ? 'TIRO DA 3 PUNTI! +3' : 'CANESTRO! +2', '#f1c40f');
          this.resetShotClock();
        } else {
          this.showFeedback('ERRORE! TABELLONE', '#e74c3c');
        }
        this.time.delayedCall(1000, () => { this.resetBall(); });
      }
    });
  }

  resetBall() {
    this.isHoldingBall = true;
    this.isCharging = false;
    this.isDunking = false;
    this.isShooting = false;
    this.canScore = true;
    this.player.setPosition(225, 600);
    this.player.setScale(1);
    this.ball.setScale(1);
    this.resetShotClock();
  }

  onBallBlocked() {
    if (!this.isHoldingBall && this.canScore && !this.isDunking) {
      this.canScore = false;
      this.showFeedback('STOPPATA DAL DIFENSORE!', '#e74c3c');
    }
  }

  onScore() {}
  showFeedback(text, color) {
    this.feedbackText.setText(text);
    this.feedbackText.setStyle({ fill: color });
    this.feedbackText.setAlpha(1);

    this.tweens.add({
      targets: this.feedbackText,
      alpha: 0,
      duration: 1400,
      ease: 'Power2'
    });
  }
}

const config = {
  type: Phaser.AUTO,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: 450,
    height: 800
  },
  physics: {
    default: 'arcade',
    arcade: { debug: false }
  },
  scene: BasketballTopDown
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
