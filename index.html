<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Basket Top-Down - Meter 2K & Giocatori Dettagliati</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

<script>
class Basketball2KStyle extends Phaser.Scene {
  constructor() {
    super('Basketball2KStyle');
  }

  preload() {
    this.createGraphicAssets();
  }

  createGraphicAssets() {
    let g = this.add.graphics();

    // --- GIOCATORE ATTACCANTE (Azzurro / Bianco) ---
    // Gambe
    g.fillStyle(0xd1ccc0, 1);
    g.fillRect(10, 32, 6, 12);
    g.fillRect(20, 32, 6, 12);
    // Pantaloncini
    g.fillStyle(0x2980b9, 1);
    g.fillRect(8, 22, 20, 12);
    // Busto / Canotta
    g.fillStyle(0x3498db, 1);
    g.fillRect(8, 10, 20, 14);
    // Braccia
    g.fillStyle(0xd1ccc0, 1);
    g.fillRect(2, 10, 6, 16);
    g.fillRect(28, 10, 6, 16);
    // Testa
    g.fillStyle(0xf5cd79, 1);
    g.fillCircle(18, 8, 7);
    g.generateTexture('player', 36, 46);
    g.clear();

    // --- DIFENSORE IA (Rosso / Nero) ---
    // Gambe
    g.fillStyle(0xd1ccc0, 1);
    g.fillRect(10, 32, 6, 12);
    g.fillRect(20, 32, 6, 12);
    // Pantaloncini
    g.fillStyle(0x900c3f, 1);
    g.fillRect(8, 22, 20, 12);
    // Busto / Canotta
    g.fillStyle(0xc0392b, 1);
    g.fillRect(8, 10, 20, 14);
    // Braccia
    g.fillStyle(0xd1ccc0, 1);
    g.fillRect(2, 10, 6, 16);
    g.fillRect(28, 10, 6, 16);
    // Testa
    g.fillStyle(0xe58e26, 1);
    g.fillCircle(18, 8, 7);
    g.generateTexture('defender', 36, 46);
    g.clear();

    // --- PALLONE ---
    g.fillStyle(0xe67e22, 1);
    g.fillCircle(10, 10, 10);
    g.lineStyle(1, 0x000000, 0.6);
    g.strokeCircle(10, 10, 10);
    g.lineBetween(0, 10, 20, 10);
    g.generateTexture('ball', 20, 20);
    g.clear();

    // D-Pad Base & Leva
    g.fillStyle(0xffffff, 0.2);
    g.fillCircle(60, 60, 60);
    g.lineStyle(2, 0xffffff, 0.5);
    g.strokeCircle(60, 60, 60);
    g.generateTexture('dpad_base', 120, 120);
    g.clear();

    g.fillStyle(0x3498db, 0.8);
    g.fillCircle(25, 25, 25);
    g.generateTexture('dpad_stick', 50, 50);
    g.clear();

    // Tasto Tiro
    g.fillStyle(0x2ecc71, 0.8);
    g.fillCircle(38, 38, 38);
    g.generateTexture('btn_shoot', 76, 76);
    g.clear();

    // Tasto Reset
    g.fillStyle(0xf1c40f, 0.8);
    g.fillCircle(20, 20, 20);
    g.generateTexture('btn_reset', 40, 40);
    g.destroy();
  }

  create() {
    this.input.addPointer(2);
    this.physics.world.setBounds(0, 0, 450, 800);

    // Campo da gioco
    this.drawCourt();

    // Canestro
    this.hoopX = 225;
    this.hoopY = 80;
    this.scoreZone = this.add.zone(this.hoopX, this.hoopY, 24, 24);
    this.physics.add.existing(this.scoreZone, true);

    // Giocatori
    this.player = this.physics.add.sprite(225, 600, 'player');
    this.player.setCollideWorldBounds(true);

    this.defender = this.physics.add.sprite(225, 300, 'defender');
    this.defender.setCollideWorldBounds(true);

    // Pallone
    this.ball = this.physics.add.sprite(225, 610, 'ball');
    this.ball.setCollideWorldBounds(true);

    // Grafica Shot Meter 2K (Semicerchio)
    this.meterGraphics = this.add.graphics();

    // Stato Gioco
    this.isHoldingBall = true;
    this.isShooting = false;
    this.isDunking = false;
    this.canScore = true;

    // Shot Meter Variables (NBA 2K)
    this.isCharging = false;
    this.meterProgress = 0; // da 0 a 100
    this.greenZone = 75;    // Punto di rilascio ideale

    // UI & Timer
    this.score = 0;
    this.shotClockTime = 24;
    this.scoreText = this.add.text(15, 15, 'Punti: 0', { fontSize: '18px', fill: '#fff', fontStyle: 'bold' });
    this.shotClockText = this.add.text(350, 15, '24s: 24', { fontSize: '18px', fill: '#f1c40f', fontStyle: 'bold' });
    this.feedbackText = this.add.text(225, 380, '', { fontSize: '26px', fill: '#f1c40f', fontStyle: 'bold' }).setOrigin(0.5);

    // Timer dei 24s
    this.shotClockEvent = this.time.addEvent({
      delay: 1000,
      callback: this.updateShotClock,
      callbackScope: this,
      loop: true
    });

    // Collisioni
    this.physics.add.overlap(this.ball, this.scoreZone, this.onScore, null, this);
    this.physics.add.overlap(this.ball, this.defender, this.onBallBlocked, null, this);

    // Controlli
    this.joystickVector = { x: 0, y: 0 };
    this.createTouchControls();
  }

  drawCourt() {
    let g = this.add.graphics();

    // Parquet
    g.fillStyle(0xd35400, 1);
    g.fillRect(10, 50, 430, 740);

    // Bordo campo
    g.lineStyle(3, 0xffffff, 0.9);
    g.strokeRect(10, 50, 430, 740);

    // Arco da 3 Punti
    g.beginPath();
    g.arc(225, 80, 210, 0.15 * Math.PI, 0.85 * Math.PI, false);
    g.strokePath();

    // Pitturato / Area
    g.fillStyle(0xc0392b, 0.8);
    g.fillRect(155, 50, 140, 180);
    g.strokeRect(155, 50, 140, 180);

    // Lunetta Tiro Libero
    g.beginPath();
    g.arc(225, 230, 70, 0, Math.PI, false);
    g.strokePath();

    g.lineStyle(2, 0xffffff, 0.5);
    g.beginPath();
    g.arc(225, 230, 70, Math.PI, 2 * Math.PI, false);
    g.strokePath();

    // Tabellone e Canestro
    g.lineStyle(4, 0xffffff, 1);
    g.lineBetween(185, 60, 265, 60);

    g.lineStyle(3, 0xe67e22, 1);
    g.strokeCircle(225, 75, 14);
  }

  createTouchControls() {
    // Joystick 360°
    const jx = 85, jy = 690;
    const dpadBase = this.add.image(jx, jy, 'dpad_base').setInteractive();
    const dpadStick = this.add.image(jx, jy, 'dpad_stick');

    let isTouchingJoystick = false;

    this.input.on('pointerdown', (pointer) => {
      if (Phaser.Math.Distance.Between(pointer.x, pointer.y, jx, jy) < 60) {
        isTouchingJoystick = true;
      }
    });

    this.input.on('pointermove', (pointer) => {
      if (isTouchingJoystick) {
        const dist = Phaser.Math.Distance.Between(pointer.x, pointer.y, jx, jy);
        const angle = Phaser.Math.Angle.Between(jx, jy, pointer.x, pointer.y);
        const maxRadius = 40;
        const clampDist = Math.min(dist, maxRadius);

        dpadStick.x = jx + Math.cos(angle) * clampDist;
        dpadStick.y = jy + Math.sin(angle) * clampDist;

        this.joystickVector.x = Math.cos(angle) * (clampDist / maxRadius);
        this.joystickVector.y = Math.sin(angle) * (clampDist / maxRadius);
      }
    });

    const resetJoystick = () => {
      isTouchingJoystick = false;
      dpadStick.setPosition(jx, jy);
      this.joystickVector = { x: 0, y: 0 };
    };

    this.input.on('pointerup', resetJoystick);

    // Tasto Tiro
    const btnShoot = this.add.image(360, 690, 'btn_shoot').setInteractive();
    this.add.text(338, 682, 'TIRO', { fontSize: '16px', fill: '#fff', fontStyle: 'bold' });

    btnShoot.on('pointerdown', () => {
      if (this.isHoldingBall && !this.isShooting && !this.isDunking) {
        const distToHoop = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.hoopX, this.hoopY);

        if (distToHoop < 180) {
          this.executeDunk();
        } else {
          // Inizia il caricamento stile NBA 2K
          this.isCharging = true;
          this.meterProgress = 0;
        }
      }
    });

    btnShoot.on('pointerup', () => {
      if (this.isHoldingBall && this.isCharging && !this.isDunking) {
        this.shootBall();
      }
    });

    // Reset Tasto
    const btnReset = this.add.image(400, 30, 'btn_reset').setInteractive();
    this.add.text(393, 20, '↺', { fontSize: '20px', fill: '#fff', fontStyle: 'bold' });
    btnReset.on('pointerdown', () => { this.resetBall(); });
  }

  updateShotClock() {
    if (this.shotClockTime > 0) {
      this.shotClockTime--;
      this.shotClockText.setText('24s: ' + this.shotClockTime);
      if (this.shotClockTime <= 5) this.shotClockText.setFill('#e74c3c');
      else this.shotClockText.setFill('#f1c40f');
    } else {
      this.showFeedback('INFRAZIONE 24 SECONDI!', '#e74c3c');
      this.resetBall();
    }
  }

  resetShotClock() {
    this.shotClockTime = 24;
    this.shotClockText.setText('24s: 24');
    this.shotClockText.setFill('#f1c40f');
  }

  update() {
    // Movimento Giocatore
    const speed = 175;
    if (!this.isCharging && !this.isDunking && !this.isShooting) {
      this.player.setVelocity(this.joystickVector.x * speed, this.joystickVector.y * speed);
    } else {
      this.player.setVelocity(0, 0);
    }

    // Aggiornamento Shot Meter 2K
    if (this.isCharging) {
      this.meterProgress += 2.2;
      if (this.meterProgress > 100) this.meterProgress = 100;
      this.draw2KShotMeter();
    } else {
      this.meterGraphics.clear();
    }

    // Pallone in mano
    if (this.isHoldingBall && !this.isDunking) {
      this.ball.setPosition(this.player.x, this.player.y - 10);
    }

    this.updateDefenderAI();
  }

  draw2KShotMeter() {
    this.meterGraphics.clear();

    const px = this.player.x;
    const py = this.player.y - 35;
    const radius = 28;

    // Arco di Sfondo (Grigio)
    this.meterGraphics.lineStyle(6, 0x333333, 0.8);
    this.meterGraphics.beginPath();
    this.meterGraphics.arc(px, py, radius, Phaser.Math.DegToRad(180), Phaser.Math.DegToRad(360), false);
    this.meterGraphics.strokePath();

    // Tattino Verde (Release Perfetto)
    const greenAngle = 180 + (this.greenZone / 100) * 180;
    this.meterGraphics.lineStyle(8, 0x2ecc71, 1);
    this.meterGraphics.beginPath();
    this.meterGraphics.arc(px, py, radius, Phaser.Math.DegToRad(greenAngle - 4), Phaser.Math.DegToRad(greenAngle + 4), false);
    this.meterGraphics.strokePath();

    // Indicatore di Caricamento (Giallo/Bianco)
    const currentAngle = 180 + (this.meterProgress / 100) * 180;
    this.meterGraphics.lineStyle(6, 0xf1c40f, 1);
    this.meterGraphics.beginPath();
    this.meterGraphics.arc(px, py, radius, Phaser.Math.DegToRad(180), Phaser.Math.DegToRad(currentAngle), false);
    this.meterGraphics.strokePath();
  }

  updateDefenderAI() {
    if (this.isDunking) return;

    const targetX = Phaser.Math.Linear(this.player.x, this.hoopX, 0.45);
    const targetY = Phaser.Math.Linear(this.player.y, this.hoopY, 0.45);

    if (Phaser.Math.Distance.Between(this.defender.x, this.defender.y, targetX, targetY) > 10) {
      this.physics.moveTo(this.defender, targetX, targetY, 130);
    } else {
      this.defender.setVelocity(0, 0);
    }
  }

  executeDunk() {
    this.isDunking = true;
    this.isHoldingBall = false;

    this.tweens.add({
      targets: [this.player, this.ball],
      scaleX: 1.5,
      scaleY: 1.5,
      duration: 350,
      yoyo: true,
      ease: 'Quad.easeOut'
    });

    this.tweens.add({
      targets: this.player,
      x: this.hoopX,
      y: this.hoopY + 25,
      duration: 500,
      ease: 'Power2.easeOut',
      onUpdate: () => {
        this.ball.setPosition(this.player.x, this.player.y - 10);
      },
      onComplete: () => {
        this.isDunking = false;
        this.ball.setPosition(this.hoopX, this.hoopY);
        this.score += 2;
        this.scoreText.setText('Punti: ' + this.score);
        this.showFeedback('SCHIACCIATA! +2', '#2ecc71');
        this.resetShotClock();

        this.time.delayedCall(800, () => { this.resetBall(); });
      }
    });
  }

  shootBall() {
    this.isHoldingBall = false;
    this.isCharging = false;
    this.isShooting = true;
    this.canScore = true;

    // Calcolo Rilascio 2K (Green Release)
    const diff = Math.abs(this.meterProgress - this.greenZone);
    const isGreen = diff <= 4;
    const isSlightly = diff <= 15;

    const distToHoop = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.hoopX, this.hoopY);
    const is3Pointer = distToHoop > 210;

    let targetX = this.hoopX;
    let targetY = this.hoopY;

    if (!isGreen) {
      targetX += Phaser.Math.Between(-35, 35);
      targetY += Phaser.Math.Between(-30, 30);
    }

    const duration = 850;

    // Animazione Parabola Tiro
    this.tweens.add({
      targets: this.ball,
      scaleX: 2.0,
      scaleY: 2.0,
      duration: duration / 2,
      yoyo: true,
      ease: 'Sine.easeOut'
    });

    this.tweens.add({
      targets: this.ball,
      x: targetX,
      y: targetY,
      duration: duration,
      ease: 'Cubic.easeOut',
      onComplete: () => {
        this.isShooting = false;
        if (isGreen || isSlightly) {
          const pts = is3Pointer ? 3 : 2;
          this.score += pts;
          this.scoreText.setText('Punti: ' + this.score);

          if (isGreen) {
            this.showFeedback('PERFECT RELEASE! GREEN! ' + (is3Pointer ? '+3' : '+2'), '#2ecc71');
          } else {
            this.showFeedback(is3Pointer ? 'TIRO DA 3 PUNTI! +3' : 'CANESTRO! +2', '#f1c40f');
          }
          this.resetShotClock();
        } else {
          this.showFeedback('RELEASE SLOW/FAST! ERRORE', '#e74c3c');
        }
        this.time.delayedCall(1000, () => { this.resetBall(); });
      }
    });
  }

  resetBall() {
    this.isHoldingBall = true;
    this.isCharging = false;
    this.isDunking = false;
    this.isShooting = false;
    this.canScore = true;
    this.player.setPosition(225, 600);
    this.player.setScale(1);
    this.ball.setScale(1);
    this.resetShotClock();
  }

  onBallBlocked() {
    if (!this.isHoldingBall && this.canScore && !this.isDunking) {
      this.canScore = false;
      this.showFeedback('STOPPATA DAL DIFENSORE!', '#e74c3c');
    }
  }

  onScore() {}

  showFeedback(text, color) {
    this.feedbackText.setText(text);
    this.feedbackText.setStyle({ fill: color });
    this.feedbackText.setAlpha(1);

    this.tweens.add({
      targets: this.feedbackText,
      alpha: 0,
      duration: 1400,
      ease: 'Power2'
    });
  }
}

const config = {
  type: Phaser.AUTO,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: 450,
    height: 800
  },
  physics: {
    default: 'arcade',
    arcade: { debug: false }
  },
  scene: Basketball2KStyle
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
