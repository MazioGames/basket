
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Meccanica Tiro Basket - Phaser 3</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; }
  </style>
</head>
<body>

<script>
class BasketballGame extends Phaser.Scene {
  constructor() {
    super('BasketballGame');
  }

  preload() {
    // Generiamo direttamente texture procedurali semplici per evitare file esterni
    this.createGraphicAssets();
  }

  createGraphicAssets() {
    // Giocatore (Rettangolo Blu)
    let g = this.add.graphics();
    g.fillStyle(0x3498db, 1);
    g.fillRect(0, 0, 32, 64);
    g.generateTexture('player', 32, 64);
    g.clear();

    // Pallone (Cerchio Arancione)
    g.fillStyle(0xe67e22, 1);
    g.fillCircle(12, 12, 12);
    g.generateTexture('ball', 24, 24);
    g.clear();

    // Tabellone e Anello
    g.fillStyle(0xffffff, 1);
    g.fillRect(0, 0, 8, 120); // Tabellone
    g.fillStyle(0xe74c3c, 1);
    g.fillRect(-25, 40, 25, 6); // Anello
    g.generateTexture('hoop', 33, 120);
    g.destroy();
  }

  create() {
    // 1. Configurazione Mondo e Fisica
    this.physics.world.setBounds(0, 0, 800, 500);
    this.physics.world.gravity.y = 800;

    // Campo (Pavimento)
    const ground = this.add.rectangle(400, 490, 800, 20, 0x7f8c8d);
    this.physics.add.existing(ground, true);

    // 2. Canestro e Tabellone
    this.hoop = this.physics.add.staticImage(750, 260, 'hoop');
    
    // Punto sensore per il punteggio (dentro l'anello)
    this.scoreZone = this.add.zone(735, 305, 20, 5);
    this.physics.add.existing(this.scoreZone, true);

    // 3. Giocatore
    this.player = this.physics.add.sprite(200, 400, 'player');
    this.player.setCollideWorldBounds(true);
    this.physics.add.collider(this.player, ground);

    // 4. Pallone
    this.ball = this.physics.add.sprite(200, 380, 'ball');
    this.ball.setBounce(0.6);
    this.ball.setFriction(0.1);
    this.ball.setCollideWorldBounds(true);
    this.physics.add.collider(this.ball, ground);
    this.physics.add.collider(this.ball, this.hoop);

    // 5. Variabili di Stato Tiro
    this.isHoldingBall = true;
    this.isCharging = false;
    this.chargePower = 0;
    this.maxPower = 700;
    this.minPower = 200;

    // Grafica per la linea della traiettoria
    this.trajectoryGraphics = this.add.graphics();

    // Testo Punteggio
    this.score = 0;
    this.scoreText = this.add.text(16, 16, 'Punti: 0', { fontSize: '24px', fill: '#fff' });

    // Rilevamento Canestro
    this.physics.add.overlap(this.ball, this.scoreZone, this.onScore, null, this);

    // 6. Controlli Input
    this.cursors = this.input.keyboard.createCursorKeys();
    this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    this.resetKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);
  }

  update() {
    // Reset palla con tasto R
    if (Phaser.Input.Keyboard.JustDown(this.resetKey)) {
      this.resetBall();
    }

    // Gestione Movimento Giocatore (solo se non sta caricando il tiro)
    if (!this.isCharging) {
      if (this.cursors.left.isDown) {
        this.player.setVelocityX(-160);
      } else if (this.cursors.right.isDown) {
        this.player.setVelocityX(160);
      } else {
        this.player.setVelocityX(0);
      }
    } else {
      this.player.setVelocityX(0);
    }

    // Posizione palla in mano al giocatore
    if (this.isHoldingBall) {
      this.ball.setPosition(this.player.x + 15, this.player.y - 10);
      this.ball.body.setVelocity(0, 0);
      this.ball.body.setAllowGravity(false);

      // Inizio caricamento tiro
      if (Phaser.Input.Keyboard.JustDown(this.spaceKey)) {
        this.isCharging = true;
        this.chargePower = this.minPower;
      }

      // Durante il caricamento
      if (this.spaceKey.isDown && this.isCharging) {
        this.chargePower = Math.min(this.chargePower + 8, this.maxPower);
        this.drawTrajectory();
      }

      // Rilascio tiro
      if (Phaser.Input.Keyboard.JustUp(this.spaceKey) && this.isCharging) {
        this.shootBall();
      }
    }
  }

  drawTrajectory() {
    this.trajectoryGraphics.clear();
    this.trajectoryGraphics.lineStyle(2, 0x00ff00, 0.8);

    const startX = this.ball.x;
    const startY = this.ball.y;
    
    // Calcolo componenti della velocità (angolo fisso ~45 gradi verso l'alto/destra)
    const vx = this.chargePower * 0.75;
    const vy = -this.chargePower * 0.95;
    const gravity = this.physics.world.gravity.y;

    // Disegna la parabola simulando i punti della fisica
    let prevX = startX;
    let prevY = startY;

    for (let t = 0.05; t < 1.2; t += 0.05) {
      const x = startX + vx * t;
      const y = startY + vy * t + 0.5 * gravity * t * t;

      this.trajectoryGraphics.lineBetween(prevX, prevY, x, y);
      prevX = x;
      prevY = y;
    }
  }

  shootBall() {
    this.isHoldingBall = false;
    this.isCharging = false;
    this.trajectoryGraphics.clear();

    this.ball.body.setAllowGravity(true);
    
    // Vettori spinta: componente X (avanti) e Y (alto)
    const vx = this.chargePower * 0.75;
    const vy = -this.chargePower * 0.95;

    this.ball.setVelocity(vx, vy);
    this.ball.setAngularVelocity(300); // Effetto rotazione
  }

  resetBall() {
    this.isHoldingBall = true;
    this.isCharging = false;
    this.trajectoryGraphics.clear();
    this.ball.setAngularVelocity(0);
  }

  onScore(ball, zone) {
    // Conta il punto solo se la palla sta scendendo (velocità Y positiva)
    if (!this.isHoldingBall && ball.body.velocity.y > 0) {
      this.score += 2;
      this.scoreText.setText('Punti: ' + this.score);
      this.resetBall();
    }
  }
}

const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 500,
  physics: {
    default: 'arcade',
    arcade: {
      gravity: { y: 800 },
      debug: false
    }
  },
  scene: BasketballGame
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
