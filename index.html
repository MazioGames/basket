<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Basket Mobile 24s - Phaser 3</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

<script>
class BasketballGame extends Phaser.Scene {
  constructor() {
    super('BasketballGame');
  }

  preload() {
    this.createGraphicAssets();
  }

  createGraphicAssets() {
    let g = this.add.graphics();

    // Attaccante (Azzurro)
    g.fillStyle(0x3498db, 1);
    g.fillRect(0, 0, 32, 64);
    g.generateTexture('player', 32, 64);
    g.clear();

    // Difensore IA (Rosso)
    g.fillStyle(0xe74c3c, 1);
    g.fillRect(0, 0, 32, 64);
    g.generateTexture('defender', 32, 64);
    g.clear();

    // Pallone (Arancione)
    g.fillStyle(0xe67e22, 1);
    g.fillCircle(12, 12, 12);
    g.generateTexture('ball', 24, 24);
    g.clear();

    // Struttura Canestro Visibile (Tabellone + Anello + Retina)
    g.fillStyle(0xffffff, 0.9);
    g.fillRect(25, 0, 8, 90);
    g.fillStyle(0xe67e22, 1);
    g.fillRect(0, 45, 25, 6);
    g.fillStyle(0xffffff, 0.5);
    g.beginPath();
    g.moveTo(2, 51);
    g.lineTo(7, 75);
    g.lineTo(18, 75);
    g.lineTo(23, 51);
    g.closePath();
    g.fillPath();
    g.generateTexture('hoop_structure', 35, 90);
    g.clear();

    // Controlli Touch
    g.fillStyle(0xffffff, 0.3);
    g.fillCircle(30, 30, 30);
    g.generateTexture('btn_arrow', 60, 60);
    g.clear();

    g.fillStyle(0x2ecc71, 0.7);
    g.fillCircle(40, 40, 40);
    g.generateTexture('btn_shoot', 80, 80);
    g.clear();

    g.fillStyle(0xf1c40f, 0.7);
    g.fillCircle(25, 25, 25);
    g.generateTexture('btn_reset', 50, 50);
    g.destroy();
  }

  create() {
    this.input.addPointer(2);

    // Mondo e Fisica
    this.physics.world.setBounds(0, 0, 800, 450);
    this.physics.world.gravity.y = 800;

    // Campo (Pavimento)
    this.ground = this.add.rectangle(400, 440, 800, 20, 0x7f8c8d);
    this.physics.add.existing(this.ground, true);

    // Asta Sostegno Canestro
    this.add.rectangle(725, 300, 10, 260, 0x333333);

    // Canestro Visibile
    this.hoop = this.physics.add.staticImage(690, 220, 'hoop_structure');
    this.scoreZone = this.add.zone(678, 268, 20, 5);
    this.physics.add.existing(this.scoreZone, true);

    // Giocatore Attaccante
    this.player = this.physics.add.sprite(150, 350, 'player');
    this.player.setCollideWorldBounds(true);
    this.physics.add.collider(this.player, this.ground);

    // Difensore IA
    this.defender = this.physics.add.sprite(500, 350, 'defender');
    this.defender.setCollideWorldBounds(true);
    this.physics.add.collider(this.defender, this.ground);

    // Pallone
    this.ball = this.physics.add.sprite(150, 330, 'ball');
    this.ball.setBounce(0.6);
    this.ball.setFriction(0.1);
    this.ball.setCollideWorldBounds(true);
    this.physics.add.collider(this.ball, this.ground);
    this.physics.add.collider(this.ball, this.hoop);

    // Collisione Pallone - Difensore
    this.physics.add.collider(this.ball, this.defender, this.onBallBlocked, null, this);

    // Stato Gioco
    this.isHoldingBall = true;
    this.isCharging = false;
    this.isDunking = false;
    this.chargePower = 0;
    this.maxPower = 780;
    this.minPower = 250;
    this.canScore = true;

    // Grafica Traiettoria
    this.trajectoryGraphics = this.add.graphics();

    // UI (Punti & Timer 24s)
    this.score = 0;
    this.shotClockTime = 24;
    this.scoreText = this.add.text(20, 15, 'Punti: 0', { fontSize: '20px', fill: '#fff', fontStyle: 'bold' });
    this.shotClockText = this.add.text(700, 15, '24s: 24', { fontSize: '20px', fill: '#f1c40f', fontStyle: 'bold' });
    this.feedbackText = this.add.text(400, 180, '', { fontSize: '30px', fill: '#f1c40f', fontStyle: 'bold' }).setOrigin(0.5);

    // Timer dei 24 Secondi
    this.shotClockEvent = this.time.addEvent({
      delay: 1000,
      callback: this.updateShotClock,
      callbackScope: this,
      loop: true
    });

    // Overlap Canestro
    this.physics.add.overlap(this.ball, this.scoreZone, this.onScore, null, this);

    // Controlli
    this.moveLeft = false;
    this.moveRight = false;
    this.createTouchControls();
  }

  createTouchControls() {
    // Tasto Sinistra
    const btnLeft = this.add.image(60, 390, 'btn_arrow').setInteractive();
    this.add.text(52, 380, '◄', { fontSize: '22px', fill: '#fff' });

    btnLeft.on('pointerdown', () => { this.moveLeft = true; });
    btnLeft.on('pointerup', () => { this.moveLeft = false; });
    btnLeft.on('pointerout', () => { this.moveLeft = false; });

    // Tasto Destra
    const btnRight = this.add.image(140, 390, 'btn_arrow').setInteractive();
    this.add.text(132, 380, '►', { fontSize: '22px', fill: '#fff' });

    btnRight.on('pointerdown', () => { this.moveRight = true; });
    btnRight.on('pointerup', () => { this.moveRight = false; });
    btnRight.on('pointerout', () => { this.moveRight = false; });

    // Tasto TIRO / SCHIACCIATA
    const btnShoot = this.add.image(710, 380, 'btn_shoot').setInteractive();
    this.add.text(685, 372, 'TIRO', { fontSize: '18px', fill: '#fff', fontStyle: 'bold' });

    btnShoot.on('pointerdown', () => {
      if (this.isHoldingBall && !this.isDunking) {
        const distToHoop = Math.abs(this.player.x - 675);

        // SE VICINO AL CANESTRO -> SCHIACCIATA (DUNK)
        if (distToHoop < 130) {
          this.executeDunk();
        } else {
          // ALTRIMENTI -> CARICA IL TIRO
          this.isCharging = true;
          this.chargePower = this.minPower;
          if (this.player.body.touching.down) {
            this.player.setVelocityY(-220); // Piccolo salto durante il tiro
          }
        }
      }
    });

    btnShoot.on('pointerup', () => {
      if (this.isHoldingBall && this.isCharging && !this.isDunking) {
        this.shootBall();
      }
    });

    // Tasto Reset Palla
    const btnReset = this.add.image(750, 40, 'btn_reset').setInteractive();
    this.add.text(738, 30, '↺', { fontSize: '24px', fill: '#fff', fontStyle: 'bold' });

    btnReset.on('pointerdown', () => {
      this.resetBall();
    });
  }

  updateShotClock() {
    if (this.shotClockTime > 0) {
      this.shotClockTime--;
      this.shotClockText.setText('24s: ' + this.shotClockTime);
      if (this.shotClockTime <= 5) {
        this.shotClockText.setFill('#e74c3c');
      } else {
        this.shotClockText.setFill('#f1c40f');
      }
    } else {
      this.showFeedback('INFRAZIONE 24 SECONDI!', '#e74c3c');
      this.resetBall();
    }
  }

  resetShotClock() {
    this.shotClockTime = 24;
    this.shotClockText.setText('24s: 24');
    this.shotClockText.setFill('#f1c40f');
  }

  update() {
    // Movimento Attaccante
    if (!this.isCharging && !this.isDunking) {
      if (this.moveLeft) {
        this.player.setVelocityX(-160);
      } else if (this.moveRight) {
        this.player.setVelocityX(160);
      } else {
        this.player.setVelocityX(0);
      }
    } else if (this.isCharging) {
      this.player.setVelocityX(0);
    }

    // Difensore IA
    this.updateDefenderAI();

    // Palla in mano al giocatore
    if (this.isHoldingBall && !this.isDunking) {
      this.ball.setPosition(this.player.x + 15, this.player.y - 10);
      this.ball.body.setVelocity(0, 0);
      this.ball.body.setAllowGravity(false);

      if (this.isCharging) {
        this.chargePower = Math.min(this.chargePower + 9, this.maxPower);
        this.drawTrajectory();
      }
    }
  }

  updateDefenderAI() {
    if (this.isDunking) return;

    const targetX = Phaser.Math.Clamp(this.player.x + 110, 350, 620);
    const distanceToTarget = targetX - this.defender.x;

    if (Math.abs(distanceToTarget) > 10) {
      this.defender.setVelocityX(distanceToTarget * 2);
    } else {
      this.defender.setVelocityX(0);
    }

    // Salto di contestazione tiro/schiacciata
    const distToPlayer = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.defender.x, this.defender.y);
    if ((this.isCharging || this.isDunking) && distToPlayer < 160 && this.defender.body.touching.down) {
      this.defender.setVelocityY(-360);
    }
  }

  drawTrajectory() {
    this.trajectoryGraphics.clear();
    this.trajectoryGraphics.lineStyle(2, 0x00ff00, 0.8);

    const startX = this.ball.x;
    const startY = this.ball.y;
    // Parabola morbida ed elevata
    const vx = this.chargePower * 0.68;
    const vy = -this.chargePower * 1.05;
    const gravity = this.physics.world.gravity.y;

    let prevX = startX;
    let prevY = startY;

    for (let t = 0.05; t < 1.15; t += 0.05) {
      const x = startX + vx * t;
      const y = startY + vy * t + 0.5 * gravity * t * t;
      this.trajectoryGraphics.lineBetween(prevX, prevY, x, y);
      prevX = x;
      prevY = y;
    }
  }

  executeDunk() {
    this.isDunking = true;
    this.isCharging = false;
    this.trajectoryGraphics.clear();

    // Animazione di salto e schiacciata verso il canestro
    this.tweens.add({
      targets: this.player,
      x: 650,
      y: 210,
      duration: 450,
      ease: 'Power2',
      onUpdate: () => {
        this.ball.setPosition(this.player.x + 10, this.player.y - 15);
      },
      onComplete: () => {
        // Schiacciata effettuata
        this.isHoldingBall = false;
        this.isDunking = false;
        this.ball.body.setAllowGravity(true);
        this.ball.setPosition(675, 230);
        this.ball.setVelocity(0, 300); // Palla spinta con forza in basso

        this.showFeedback('SCHIACCIATA! +2', '#2ecc71');
        this.score += 2;
        this.scoreText.setText('Punti: ' + this.score);
        this.resetShotClock();

        // Caduta del giocatore sul campo
        this.player.setVelocityY(200);
      }
    });
  }

  shootBall() {
    this.isHoldingBall = false;
    this.isCharging = false;
    this.canScore = true;
    this.trajectoryGraphics.clear();

    this.ball.body.setAllowGravity(true);
    const vx = this.chargePower * 0.68;
    const vy = -this.chargePower * 1.05;

    this.ball.setVelocity(vx, vy);
    this.ball.setAngularVelocity(300);

    this.resetShotClock();
  }

  resetBall() {
    this.isHoldingBall = true;
    this.isCharging = false;
    this.isDunking = false;
    this.canScore = true;
    this.trajectoryGraphics.clear();
    this.ball.setAngularVelocity(0);
    this.resetShotClock();
  }

  onBallBlocked() {
    if (!this.isHoldingBall && this.canScore) {
      this.canScore = false;
      this.showFeedback('STOPPATA!', '#e74c3c');
    }
  }

  onScore(ball, zone) {
    if (!this.isHoldingBall && this.canScore && ball.body.velocity.y > 0) {
      this.score += 2;
      this.canScore = false;
      this.scoreText.setText('Punti: ' + this.score);
      this.showFeedback('CANESTRO! +2', '#f1c40f');
      this.resetShotClock();
    }
  }

  showFeedback(text, color) {
    this.feedbackText.setText(text);
    this.feedbackText.setStyle({ fill: color });
    this.feedbackText.setScale(1);
    this.feedbackText.setAlpha(1);

    this.tweens.add({
      targets: this.feedbackText,
      y: 140,
      alpha: 0,
      duration: 1200,
      ease: 'Power2',
      onComplete: () => {
        this.feedbackText.setPosition(400, 180);
      }
    });
  }
}

const config = {
  type: Phaser.AUTO,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: 800,
    height: 450
  },
  physics: {
    default: 'arcade',
    arcade: {
      gravity: { y: 800 },
      debug: false
    }
  },
  scene: BasketballGame
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
